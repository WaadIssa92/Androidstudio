name: Build SimpleCounter APK

on:
  push:
    paths:
      - 'SimpleCounter/**'
      - '.github/workflows/simple-counter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimpleCounter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SimpleCounter.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: simple-counter-build-${{ github.run_number }}
          name: Simple Counter (build ${{ github.run_number }})
          body: Download SimpleCounter.apk below on your Android phone and open it to install.
          target_commitish: ${{ github.sha }}
          files: SimpleCounter/SimpleCounter.apk
